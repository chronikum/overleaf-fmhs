name: overleaf-extended-ce

services:
  overleaf:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/overleaf-extended-ce:6.1.2-ext-v4.1-koma
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${OVERLEAF_PORT:-8080}:80"
    stop_grace_period: 60s
    volumes:
      - overleaf-data:/var/lib/overleaf
    environment:
      OVERLEAF_APP_NAME: "${OVERLEAF_APP_NAME:-Overleaf Extended CE}"
      OVERLEAF_NAV_TITLE: "${OVERLEAF_NAV_TITLE:-Overleaf Extended CE}"
      OVERLEAF_SITE_URL: "${OVERLEAF_SITE_URL:-http://127.0.0.1:8080}"
      OVERLEAF_ADMIN_EMAIL: "${OVERLEAF_ADMIN_EMAIL:-admin@example.com}"
      OVERLEAF_EMAIL_FROM_ADDRESS: "${OVERLEAF_EMAIL_FROM_ADDRESS:-overleaf@example.com}"
      OVERLEAF_SESSION_SECRET: "${OVERLEAF_SESSION_SECRET:-change-me-generate-a-long-random-string}"

      OVERLEAF_MONGO_URL: "mongodb://mongo:27017/sharelatex?replicaSet=overleaf"
      MONGO_URL: "mongodb://mongo:27017/sharelatex?replicaSet=overleaf"
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      OVERLEAF_REDIS_PORT: "6379"
      REDIS_PORT: "6379"

      OVERLEAF_BEHIND_PROXY: "${OVERLEAF_BEHIND_PROXY:-true}"
      OVERLEAF_TRUSTED_PROXY_IPS: "${OVERLEAF_TRUSTED_PROXY_IPS:-loopback}"
      OVERLEAF_ALLOW_PUBLIC_ACCESS: "${OVERLEAF_ALLOW_PUBLIC_ACCESS:-false}"
      EMAIL_CONFIRMATION_DISABLED: "${EMAIL_CONFIRMATION_DISABLED:-true}"

      # Sandboxed compiles are intentionally disabled for this v1 setup.
      SANDBOXED_COMPILES: "false"
      DOCKER_RUNNER: "false"

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "overleaf", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status().ok
          } catch (error) {
            rs.initiate({
              _id: "overleaf",
              members: [{ _id: 0, host: "mongo:27017" }]
            }).ok
          }
        '

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  overleaf-data:
  mongo-data:
  redis-data:
